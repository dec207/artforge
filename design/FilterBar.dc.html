<!-- @dsCard group="Components" name="Filter bar" subtitle="모델 · LoRA · 크기 · 생성일 · 상태" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; background: #0B0D0F; }</style>
</helmet>
<div style="background: #0B0D0F; padding: 24px; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #E9E6E0;">
  <div style="width: {{ w }}px; display: flex; flex-direction: column; gap: {{ u4 }}px;">

    <label style="display: block; position: relative;">
      <input type="text" placeholder="검색" value="{{ query }}" style="
        width: 100%; background: #0B0D0F; color: #E9E6E0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px;
        border: 1px solid #39414A; padding: {{ u }}px; outline: none;">
    </label>

    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: {{ u }}px;">
        <span style="font-size: 10px; letter-spacing: .28em; color: #39414A;">{{ sec.label }}</span>
        <sc-for list="{{ sec.items }}" as="it" hint-placeholder-count="3">
          <a href="#" style="
            display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
            text-decoration: none; font-size: 12px; padding: 3px 0;
            color: {{ it.color }}; border-left: 2px solid {{ it.bar }}; padding-left: {{ u }}px;">
            <span>{{ it.name }}</span>
            <span style="font-size: 10px; color: #39414A;">{{ it.count }}</span>
          </a>
        </sc-for>
      </div>
    </sc-for>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 260, &quot;height&quot;: 560}, &quot;u&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 8, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 4, &quot;max&quot;: 16, &quot;unit&quot;: &quot;px&quot;}, &quot;w&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 200, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 140, &quot;max&quot;: 320, &quot;unit&quot;: &quot;px&quot;}, &quot;query&quot;: {&quot;editor&quot;: &quot;string&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;active&quot;: {&quot;editor&quot;: &quot;string&quot;, &quot;default&quot;: &quot;pixel-art-xl&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const u = Number(this.props.u ?? 8);
    const active = this.props.active ?? 'pixel-art-xl';
    // 축은 전부 PNG 메타데이터에서 기계가 뽑은 패싯이다 — 사람이 붙이는 태그가 아니다
    const raw = [
      { label: '모델',   items: [['sdxl-base', 11]] },
      { label: 'LORA',   items: [['pixel-art-xl', 3], ['없음', 8]] },
      { label: '크기',   items: [['1024×1024', 8], ['512×512', 2], ['64×64', 1]] },
      { label: '생성일', items: [['오늘', 5], ['최근 7일', 11], ['최근 30일', 11]] },
      { label: '상태',   items: [['공개 플래그', 1], ['만료 임박', 0], ['원본 만료됨', 0]] },
    ];
    const sections = raw.map(s => ({
      label: s.label,
      items: s.items.map(([name, count]) => {
        const on = name === active;
        return {
          name, count,
          color: on ? '#E9E6E0' : '#B3AEA6',
          // 활성 표시는 Shade — Accent 는 플래그 상태 하나에만 쓴다
          bar: on ? '#B3AEA6' : 'transparent',
        };
      }),
    }));
    return { u, u4: u * 3, w: Number(this.props.w ?? 200), query: this.props.query ?? '', sections };
  }
}
</script>
</body>
</html>
